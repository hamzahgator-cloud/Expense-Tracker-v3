<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Expense Tracker</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="message-box"></div>

    <div class="admin-layout">
        
        <aside class="sidebar">
            <div class="brand">
                <h2>Admin Panel</h2>
            </div>

            <nav class="side-nav">
                <a href="admin.html" class="active">Dashboard</a>
                <a href="index.html">User App</a>
            </nav>

            <div class="sidebar-footer">
                <p id="admin-email">—</p>
                <button id="btn-logout" type="button">Logout</button>
            </div>
        </aside>

      
        <main class="content">
            <header class="content-header">
                <div>
                    <h1>Admin Dashboard</h1>
                    <p class="subtitle">Manage users and monitor system activity</p>
                </div>
            </header>

            
            <section class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">Total Users</p>
                    <h3 id="total-users">—</h3>
                </div>

                <div class="stat-card">
                    <p class="stat-label">Total Expenses</p>
                    <h3 id="total-expenses">—</h3>
                </div>

                <div class="stat-card">
                    <p class="stat-label">Total Amount</p>
                    <h3 id="total-amount">—</h3>
                </div>

                <div class="stat-card">
                    <p class="stat-label">Average Amount</p>
                    <h3 id="average-amount">—</h3>
                </div>
            </section>

            
            <section class="panel">
                <div class="panel-header">
                    <h2>Users</h2>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Verified</th>
                                <th>Date_Created</th>
                                <th>User_Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="users-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
